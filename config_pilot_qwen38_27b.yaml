# Phase-2 candidate: Qwen3.8-27B length pilot, same 200 x 5 selection and the
# same 32k cap as the Inkling pilot. Status: DRY-RUN / MOCK ONLY, proposed in
# reap/28_MULTIMODEL_CANDIDATES_2026-08-29.md and inert until the 2026-08-30
# meeting approves it. `pilot.enabled` stays false; budget fields stay null.
#
# Why this model: public reporting (Willison, 2026-08-16) documents severe
# overthinking at the model-default xhigh effort: 22,276 reasoning tokens for
# 3,223 output tokens on one task, and hitting its own context limit on
# mundane prompts. That is the closest known public instance of the exact
# phenomenon this project measures.
#
# Model facts (openrouter.ai, read 2026-08-29): qwen/qwen3.8-27b, Apache-2
# dense 27B VLM, 11 hosts (together NOT among them; alibaba is first party).
# Listing price $0.35 in / $2.75 out per Mtok. The probe must also answer:
# does a true thinking-off mode exist through the hosted API? If yes it
# becomes rung 0 and the ladder gains an "off" level. Hosted-vs-local variant
# caveat: listing says 1M context, the local release says 262k.
#
# COST WARNING: at 3,000 calls the worst case is ~$265 total, about twice the
# Inkling pilot's scale. Trim options for the 2026-08-30 decision: drop the
# medium rung (2,000 calls, worst ~$177), run fewer datasets first, or accept
# as budgeted. Ceilings below reflect the FULL 3-level run.
#
# ALIBABA SLUG UNVERIFIED: confirm the exact OpenRouter provider slug during
# the probe before any live call.

provider:
  name: openrouter_pilot_qwen38_27b_alibaba
  base_url_env: OPENROUTER_BASE_URL
  default_base_url: https://openrouter.ai/api/v1
  api_key_env: OPENROUTER_API_KEY
  env_file_override: true
  model: "qwen/qwen3.8-27b"
  max_completion_tokens: 32000       # explicit on every request (safeguard 3)
  timeout_s: 3600
  max_retries: 0                     # one attempt per item, never resubmit
  default_headers:
    X-OpenRouter-Metadata: enabled
  request_extra_body:
    provider:
      only: [alibaba]
      allow_fallbacks: false
      require_parameters: true
      max_price:                     # listing rate 2026-08-29; re-pin at preflight
        prompt: 0.35
        completion: 2.75

effort:
  mode: openrouter_reasoning
  param_name: reasoning
  levels: [low, medium, xhigh]       # native ladder; xhigh is the model default
  ordinal: {low: 1, medium: 2, xhigh: 3}

pilot:
  enabled: false                     # live gate; humans flip this after approval
  label: exploratory_length_pilot_qwen38_27b_v1
  selection: capabilities/selections/selection_first200_v1.json   # Chirag decision 2; keep in lockstep with the Inkling config
  datasets: [mmlu_pro, gpqa_main, ifeval, wildbench_v2, omni_math] # WildBench: decision 3
  wrapper_seed: 20260830
  request_seed: 20260830
  cap: 32000                         # identical cap across models; the cap is the treatment
  report_caps: [4096, 8000, 14096, 16000, 20000]
  circuit_breaker_consecutive_errors: 5

pricing:
  input_per_mtok: 0.35               # listing rate; UNVERIFIED for the pinned host
  output_per_mtok: 2.75
  expected_input_tokens: 900
  expected_output_tokens: {low: 3000, medium: 6000, xhigh: 20000}  # xhigh expected NEAR cap by design
  cap_bounds_billable_tokens: true

budget:
  # 1,000 items x 3 levels = 3,000 calls.
  # Worst case per call at cap: ~$0.0883 -> ~$53.00/dataset, ~$264.95 total.
  # Expected at the guesses above: ~$16.13/dataset, ~$80.67 total.
  per_dataset_ceiling_usd: 55.00
  total_ceiling_usd: 270.00
  reserve_margin_usd: 10.00
  balance_verified_usd: null         # read from the OpenRouter account page
  balance_verified_on: null          # ISO date of that reading
  preflight_approved_by: null        # who approved, in writing, and when
  receipt_mismatch_stop_fraction: 0.20

paths:
  data: capabilities
  results: results_pilot/qwen38_27b_alibaba
  reports: results_pilot/qwen38_27b_alibaba/reports
  cache: .cache_pilot/qwen38_27b_alibaba
